serenity {
  project.name = "Automatización Banco Pichincha - Screenplay"
  take.screenshots = FOR_EACH_ACTION
  logging = VERBOSE
}

webdriver {
  driver = chrome
  autodownload = true
  timeouts {
    implicitlywait = 5000
    fluentwait = 15000
  }
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["start-maximized", "remote-allow-origins=*", "disable-infobars",
              "disable-gpu", "disable-dev-shm-usage", "lang=es"]
    }
  }
}

headless.mode = false

environments {
  default {
    webdriver.base.url = "https://www.pichincha.com"
  }
}
